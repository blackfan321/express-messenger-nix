[express-linux]
src.webpage = "https://updates.express.ms/desktop/latest-linux.yml"
src.regex = "version: ([0-9]+\\.[0-9]+\\.[0-9]+)"
fetch.url = "https://updates.express.ms/desktop/eXpress-$ver.AppImage"

[express-darwin]
