name: update-application

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update application
        run: nix develop -c just update-application

      - name: Read changelog
        id: changelog
        run: |
          if [[ -s .nvfetcher-changelog ]]; then
            {
              echo 'body<<EOF'
              cat .nvfetcher-changelog
              echo EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=unchanged' >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ${{ steps.changelog.outputs.body }}
          title: ${{ steps.changelog.outputs.body }}
          body: ${{ steps.changelog.outputs.body }}
          branch: chore/update-express
          add-paths: |
            _sources/generated.nix
            _sources/generated.json
            README.md
          delete-branch: true
